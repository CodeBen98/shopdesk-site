name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Only web files are published
        run: |
          bad=$(find public -type f ! -name '*.html' ! -name '*.css' ! -name '*.js' \
            ! -name '*.png' ! -name '*.jpg' ! -name '*.jpeg' ! -name '*.webp' ! -name '*.svg' \
            ! -name '*.ico' ! -name '*.mp3' ! -name '*.mp4' ! -name '*.woff2' ! -name '*.txt' \
            ! -name '*.xml' ! -name '_headers' ! -name '_redirects')
          if [ -n "$bad" ]; then echo "Not allowed in public/:"; echo "$bad"; exit 1; fi

      - name: No secrets in published files
        run: |
          if grep -rnE '(sk|pk|rk)_(live|test)_[A-Za-z0-9]{8,}|sk-ant-|nfp_[A-Za-z0-9]{8,}|AC[a-f0-9]{32}|_API_KEY\s*=' public; then
            echo "Possible secret in public/"; exit 1
          fi

      - name: Local links point to real files
        run: |
          missing=0
          for ref in $(grep -ohE '(href|src)="/[^"#?]*' public/*.html | sed -E 's/^(href|src)="//' | sort -u); do
            [ "$ref" = "/" ] && continue
            path="public$ref"
            if [ ! -e "$path" ] && [ ! -e "$path.html" ]; then echo "Broken link: $ref"; missing=1; fi
          done
          exit $missing
