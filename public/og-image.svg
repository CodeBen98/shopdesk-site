<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#04070F"/>
  <rect width="1200" height="630" fill="url(#grad)"/>
  <defs>
    <radialGradient id="grad" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0f1f35"/>
      <stop offset="100%" stop-color="#04070F"/>
    </radialGradient>
  </defs>

  <!-- Accent bar -->
  <rect x="80" y="180" width="8" height="120" rx="4" fill="#0F7695"/>

  <!-- SHOP -->
  <text x="108" y="260" fill="#F4F5F7" font-family="'Arial','Helvetica Neue',sans-serif" font-size="88" font-weight="700" letter-spacing="8">SHOP</text>
  <!-- DESK -->
  <text x="108" y="330" fill="#4A6070" font-family="'Arial','Helvetica Neue',sans-serif" font-size="64" font-weight="500" letter-spacing="20">DESK</text>

  <!-- Tagline -->
  <text x="80" y="420" fill="#7A8899" font-family="'Arial','Helvetica Neue',sans-serif" font-size="28" letter-spacing="1">Never Miss Another Call</text>

  <!-- Right side pill -->
  <rect x="780" y="220" width="340" height="60" rx="14" fill="rgba(15,118,149,0.15)" stroke="#0F7695" stroke-width="1.5"/>
  <text x="950" y="257" fill="#0F7695" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">24/7 COVERAGE</text>

  <rect x="780" y="300" width="340" height="60" rx="14" fill="rgba(15,118,149,0.1)" stroke="rgba(15,118,149,0.3)" stroke-width="1"/>
  <text x="950" y="337" fill="#C3CAD5" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">Answers calls · Books jobs · Follows up</text>

  <rect x="780" y="380" width="340" height="60" rx="14" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="950" y="417" fill="#F59E0B" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle">30-Day Free Trial · From $79/mo</text>

  <!-- Domain -->
  <text x="80" y="560" fill="#3A5060" font-family="Arial,sans-serif" font-size="22" letter-spacing="2">shopdesk.site</text>
</svg>
